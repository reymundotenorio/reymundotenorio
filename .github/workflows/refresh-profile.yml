name: Refresh profile statistics

on:
  schedule:
    # 05:23 America/Managua; schedules can be delayed by GitHub.
    - cron: '23 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-profile.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'sources/**'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'reymundotenorio/reymundotenorio'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Test current profile generator
        run: npm test

      - name: Collect aggregate statistics
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: npm run collect

      - name: Build and validate public assets
        run: |
          npm run build
          npm test
          npm run validate

      - name: Commit changed public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- README.md metrics.json assets/
          if git diff --cached --quiet; then
            echo 'Profile is already current.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: refresh profile statistics'
          gh auth setup-git
          git push origin HEAD:main
